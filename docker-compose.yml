
services:
  php:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: advocacia
      DB_USER: root
      DB_PASS: ""
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # Permite senha em branco
      MYSQL_ROOT_PASSWORD: ""             # Senha vazia
      MYSQL_DATABASE: advocacia           # Nome do banco
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql

volumes:
  db_data:
